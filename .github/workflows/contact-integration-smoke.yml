name: Verify production FormSubmit contact form
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contact:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - name: Confirm FormSubmit contact form is visible on the public homepage
        shell: bash
        run: |
          set -euo pipefail
          site="https://automateiv.vercel.app"
          for attempt in $(seq 1 30); do
            if curl --fail --silent --show-error --location --max-time 20 \
                  "${site}/?integration-check=1" > /tmp/live-home.html \
               && grep -Fq 'action="https://formsubmit.co/marsatolba6@gmail.com"' /tmp/live-home.html \
               && grep -Fq 'name="_honey"' /tmp/live-home.html \
               && grep -Fq 'name="projectType"' /tmp/live-home.html \
               && grep -Fq 'DISCUSS A SYSTEM' /tmp/live-home.html; then
              echo "SUCCESS: Public homepage renders the FormSubmit form, including its honeypot and service selector."
              echo "No enquiry was submitted; email delivery requires FormSubmit activation and a manual inbox test."
              exit 0
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "::error::Live site did not expose the new FormSubmit contact form."
              exit 1
            fi
            echo "FormSubmit form not yet visible; propagation check ${attempt}/30."
            sleep 10
          done
