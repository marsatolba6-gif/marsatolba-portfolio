name: Portfolio validation and mobile Lighthouse
on:
  push:
    branches: [main, 'portfolio-*', 'social-monogram-*', 'use-approved-*', 'use-exact-*', 'contact-projecttype-*', 'portfolio-copy-*', 'contact-delivery-*', 'restore-pdf-original-*', 'favicon-match-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Node 22
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
      - name: Install
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Typecheck
        run: npx tsc --noEmit
      - name: Verify contact fields and FormSubmit endpoint
        run: node scripts/verify-contact-contract.mjs
      - name: Verify FormSubmit acknowledgment and error behavior
        run: node scripts/verify-contact-delivery.mjs
      - name: Verify branding, process and skill content
        run: node scripts/verify-portfolio-copy.mjs
      - name: Production build
        run: npm run build
      - name: Verify minimalist social preview generated at exact dimensions
        run: |
          node --input-type=module - <<'NODE'
          import { readFile } from "node:fs/promises";
          import { createHash } from "node:crypto";
          import sharp from "sharp";
          const newImage = await readFile("public/og-pdf-monogram.png");
          const legacyPath = await readFile("public/og.png");
          const meta = await sharp(newImage).metadata();
          if (meta.format !== "png" || meta.width !== 1200 || meta.height !== 630) {
            throw new Error("Open Graph image is not a 1200x630 PNG");
          }
          if (createHash("sha256").update(newImage).digest("hex") !== createHash("sha256").update(legacyPath).digest("hex")) {
            throw new Error("Home OG thumbnails must use the same monogram artwork");
          }
          const pixel = await sharp(newImage).extract({left: 0, top: 0, width: 1, height: 1}).raw().toBuffer();
          if (pixel[0] !== 237 || pixel[1] !== 235 || pixel[2] !== 230) {
            throw new Error("Incorrect thumbnail background color");
          }
          const uploadedPdfArtwork = (await readFile("public/social-monogram.svg", "utf8"));
          if (!uploadedPdfArtwork.includes('fill="#edebe6"')
            || !uploadedPdfArtwork.includes('M.8328552 0H.6000061')
            || !uploadedPdfArtwork.includes('M.2128601 .7142792')) {
            throw new Error("The original PDF's warm off-white background or exact vector glyphs are missing.");
          }
          if (uploadedPdfArtwork.includes("MARS ATOLBA") || uploadedPdfArtwork.includes("AI AUTOMATION SPECIALIST")) {
            throw new Error("Do not add text that was not present in the uploaded PDF.");
          }
          const region = await sharp(newImage).extract({left: 475, top: 210, width: 250, height: 200}).raw().toBuffer({resolveWithObject: true});
          let black = 0;
          for (let i = 0; i < region.data.length; i += region.info.channels) {
            if (region.data[i] < 75 && region.data[i+1] < 75 && region.data[i+2] < 75) black++;
          }
          if (black < 1000) throw new Error("Original black M monogram did not render.");
          console.log("Uploaded PDF black M’ logo and warm off-white background verified.");
          NODE
      - name: Verify PDF-derived browser, Apple, and PWA icons
        run: node scripts/verify-visual-identity.mjs
      - name: Verify unchanged originals and generated lossless HD assets
        run: |
          node --input-type=module - <<'NODE'
          import { readFile, stat } from "node:fs/promises";
          import sharp from "sharp";
          const manifest = JSON.parse(await readFile("image-hd-manifest.json", "utf8"));
          for (const item of manifest.assets) {
            const original = `public${item.source}`;
            const hd = `public${item.display}`;
            const src = await sharp(original).metadata();
            const out = await sharp(hd).metadata();
            if (out.width !== src.width * 2 || out.height !== src.height * 2 || out.format !== "png")
              throw new Error(`Not a 2x lossless PNG: ${hd}`);
            if ((await stat(hd)).size === 0) throw new Error(`Empty HD image: ${hd}`);
            console.log(`${item.source}: ${src.width}x${src.height} → ${out.width}x${out.height}`);
          }
          NODE
      - name: Upload processed image samples
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-hd-image-samples
          path: public/assets/hd/*.png
          if-no-files-found: ignore
      - name: Start locally served production build
        run: |
          npm run start -- --port 3000 > /tmp/portfolio-server.log 2>&1 &
          for i in $(seq 1 45); do
            if curl --fail --silent http://localhost:3000/ > /dev/null; then exit 0; fi
            sleep 2
          done
          cat /tmp/portfolio-server.log
          exit 1
      - name: Install Lighthouse
        run: npm install --no-save --no-package-lock lighthouse@12.8.2
      - name: Mobile Lighthouse before and after
        shell: bash
        run: |
          mkdir -p lighthouse
          for spec in "before-home|https://automateiv.vercel.app/" "before-roofflow|https://automateiv.vercel.app/work/roofflow-voice-ai" "after-home|http://localhost:3000/" "after-roofflow|http://localhost:3000/work/roofflow-voice-ai"; do
            label="${spec%%|*}"
            url="${spec#*|}"
            echo "AUDITING $label — $url"
            npx lighthouse "$url" --only-categories=performance,accessibility,best-practices,seo --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" --output=json --output-path="lighthouse/${label}.json" --quiet || echo "Lighthouse failed for $label"
          done
          node - <<'NODE'
          const fs = require('fs');
          for (const label of ['before-home','before-roofflow','after-home','after-roofflow']) {
            const path = 'lighthouse/'+label+'.json';
            if (!fs.existsSync(path)) { console.log(label+': NOT AVAILABLE'); continue; }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));
            const categories = report.categories;
            const result = Object.fromEntries(['performance','accessibility','best-practices','seo'].map(k=>[k,categories[k]?.score == null ? 'N/A' : Math.round(categories[k].score*100)]));
            console.log(label+': '+JSON.stringify(result));
          }
          NODE
      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: portfolio-mobile-lighthouse
          path: lighthouse/*.json
          if-no-files-found: ignore
