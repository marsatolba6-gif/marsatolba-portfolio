name: Verify live portfolio
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check live domain serves merged portfolio
        shell: bash
        run: |
          set -euo pipefail
          site="https://automateiv.vercel.app"
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 "${site}/" > /tmp/home.html \
              && grep -Fq "SELECTED SYSTEMS" /tmp/home.html \
              && grep -Fq "Start a conversation" /tmp/home.html \
              && grep -Fq "View resume" /tmp/home.html \
              && grep -Fq "https://calendly.com/marsatolba6/30min" /tmp/home.html \
              && grep -Fq "Typically within a few hours, often sooner." /tmp/home.html \
              && grep -Fq "marsatolba6@gmail.com" /tmp/home.html \
              && grep -Fq "/og-pdf-monogram.png" /tmp/home.html; then
              echo "Homepage verified: booking link, reply window and existing email visible."
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "::error::Live domain did not serve the expected updated homepage."
              exit 1
            fi
            echo "Homepage has not propagated; retry ${attempt}/24"
            sleep 10
          done

          curl --fail --silent --show-error --location --max-time 20 \
            "${site}/work/roofflow-voice-ai" > /tmp/roofflow.html
          grep -Fq "Demo built with sample data" /tmp/roofflow.html
          grep -Fq "Create a GoHighLevel follow-up task due within 5 minutes." /tmp/roofflow.html
          grep -Fq "Where run-level evidence is unavailable" /tmp/roofflow.html
          echo "RoofFlow case study verified: project-specific evidence rows and disclaimer visible."

          status=$(curl --silent --show-error --location --max-time 30 \
            --output /tmp/social-image.bin --write-out '%{http_code} %{content_type}' \
            "${site}/work/roofflow-voice-ai/opengraph-image")
          echo "OG image response: $status"
          [[ "$status" == "200 image/png"* ]]
          file /tmp/social-image.bin
          # Verify generated HD assets are available on the production domain.
          for spec in "ghl-lead-conversion-1@2x.png|1114 x 1252" "roofflow-voice-ai-workflow@2x.png|2364 x 1156"; do
            name="${spec%%|*}"
            resolution="${spec#*|}"
            curl --fail --silent --show-error --location --max-time 20 \
              "${site}/assets/hd/${name}" --output "/tmp/${name}"
            file "/tmp/${name}" | grep -Fq "PNG image data, ${resolution}"
            echo "HD asset available: ${name} (${resolution})"
          done

          curl --fail --silent --show-error --location --max-time 20 \
            "${site}/work/gohighlevel-workflows" > /tmp/ghl.html
          grep -Fq "/assets/hd/ghl-lead-conversion-1@2x.png" /tmp/ghl.html
          grep -Fq "VIEW ORIGINAL FILE" /tmp/ghl.html
          echo "High-resolution case gallery and original file links verified."
          curl --fail --silent --show-error --location --max-time 20 \
            "${site}/og-pdf-monogram.png" --output /tmp/live-monogram.png
          file /tmp/live-monogram.png | grep -Fq "PNG image data, 1200 x 630"
          # Confirm the APPROVED soft-white thumbnail, not the previous beige version.
          node -e 'const fs=require("fs"),zlib=require("zlib");const b=fs.readFileSync("/tmp/live-monogram.png");const type=b[25];if(type!==2&&type!==6)process.exit(1);let p=8,parts=[];while(p<b.length){let n=b.readUInt32BE(p),t=b.toString("ascii",p+4,p+8);if(t==="IDAT")parts.push(b.subarray(p+8,p+8+n));p+=n+12;}const pixels=zlib.inflateSync(Buffer.concat(parts));if([pixels[1],pixels[2],pixels[3]].join(",")!=="237,235,230"){console.error("Old thumbnail is still cached");process.exit(1);}'
          echo "Uploaded PDF M’ logo social thumbnail verified."

          # The browser favicon and all mobile icons must also use the approved PDF.
          for attempt in $(seq 1 24); do
            if curl --fail --silent --show-error --location --max-time 20 \
                 "${site}/icon.svg" > /tmp/live-icon.svg \
              && grep -Fq 'fill="#edebe6"' /tmp/live-icon.svg \
              && grep -Fq 'M.8328552 0H.6000061' /tmp/live-icon.svg \
              && curl --fail --silent --show-error --location --max-time 20 \
                 "${site}/favicon.ico" > /tmp/live-favicon.ico \
              && curl --fail --silent --show-error --location --max-time 20 \
                 "${site}/apple-icon.png" > /tmp/live-apple-icon.png \
              && curl --fail --silent --show-error --location --max-time 20 \
                 "${site}/icon-192.png" > /tmp/live-pwa192.png \
              && curl --fail --silent --show-error --location --max-time 20 \
                 "${site}/icon-512.png" > /tmp/live-pwa512.png \
              && file /tmp/live-favicon.ico | grep -Fq 'MS Windows icon resource' \
              && file /tmp/live-apple-icon.png | grep -Fq 'PNG image data, 180 x 180' \
              && file /tmp/live-pwa192.png | grep -Fq 'PNG image data, 192 x 192' \
              && file /tmp/live-pwa512.png | grep -Fq 'PNG image data, 512 x 512'; then
              echo "All browser, Apple, and mobile M’ icons verified on public domain."
              break
            fi
            if [ "$attempt" -eq 24 ]; then
              echo "::error::Updated PDF-based favicons are not yet visible on the public site."
              exit 1
            fi
            echo "Favicon deployment not fully propagated; check ${attempt}/24"
            sleep 10
          done
          echo "Live smoke test passed."
